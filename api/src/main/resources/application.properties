# ─── Server ───────────────────────────────────────────────────────────────────
server.port=8080

# ─── Application ──────────────────────────────────────────────────────────────
spring.application.name=t-store-api

# ─── Neo4j ────────────────────────────────────────────────────────────────────
# Embedded Neo4j mode for zero-setup local development (no Docker / external server required)
app.neo4j.embedded.enabled=false

# Standalone / Cloud Neo4j connection properties (used when app.neo4j.embedded.enabled=false)
spring.neo4j.uri=bolt://localhost:7687
spring.neo4j.authentication.username=neo4j
spring.neo4j.authentication.password=password

# Spring Data Neo4j
spring.data.neo4j.database=neo4j

# ─── JWT ──────────────────────────────────────────────────────────────────────
app.jwt.secret=change-this-to-a-secure-256-bit-secret-key-in-production
app.jwt.expiration-ms=86400000

# ─── Actuator ─────────────────────────────────────────────────────────────────
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# ─── Logging ──────────────────────────────────────────────────────────────────
logging.level.com.tstore=DEBUG
logging.level.org.springframework.security=INFO
logging.level.org.springframework.data.neo4j=INFO
